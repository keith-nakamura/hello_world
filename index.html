<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ハングマン</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f0f6ff; color: #1d2939; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(92vw, 620px); padding: 2.5rem; border-radius: 20px; background: #fff; box-shadow: 0 15px 45px #294a7624; text-align: center; }
    h1 { margin: 0 0 .5rem; color: #175cd3; }
    .description { color: #667085; }
    pre { min-height: 150px; margin: 1.5rem auto; padding: 1rem; display: inline-block; text-align: left; color: #344054; font: 1.1rem/1.15 monospace; }
    .word { margin: 1rem 0; color: #101828; font-size: clamp(1.5rem, 7vw, 2.4rem); font-weight: 700; letter-spacing: .2rem; }
    .status { min-height: 1.6rem; color: #475467; font-weight: 600; }
    .misses { color: #d92d20; }
    form { margin-top: 1.5rem; }
    input { width: 75px; padding: .7rem; border: 2px solid #98a2b3; border-radius: 8px; font-size: 1.25rem; text-align: center; text-transform: uppercase; }
    button { margin-left: .5rem; padding: .75rem 1.1rem; border: 0; border-radius: 8px; background: #175cd3; color: white; cursor: pointer; font-size: 1rem; font-weight: 700; }
    button:hover { background: #004eeb; }
    .new-game { margin: 1rem 0 0; background: #475467; }
    .new-game:hover { background: #344054; }
  </style>
</head>
<body>
  <main>
    <h1>ハングマン</h1>
    <p class="description">隠された英単語を、6回間違える前に当てよう。</p>
    <pre id="drawing" aria-label="ハングマンの絵"></pre>
    <div id="word" class="word" aria-label="現在の単語"></div>
    <p id="status" class="status" aria-live="polite"></p>
    <p>残りミス回数: <strong id="remaining"></strong> / 6</p>
    <p id="misses" class="misses">間違えた文字: なし</p>
    <form id="guess-form">
      <label for="guess">文字を入力</label>
      <input id="guess" type="text" maxlength="1" pattern="[A-Za-z]" required autofocus>
      <button type="submit">予想する</button>
    </form>
    <button id="new-game" class="new-game" type="button">新しいゲーム</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
